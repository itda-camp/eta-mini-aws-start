# 서버(EC2)용. 빌드하지 않고 ECR 의 이미지를 받아 띄운다.
# `lab deploy` 가 이 파일을 서버의 /opt/eta/docker-compose.yml 로 보내고 .env 를 만든다.
# .env : REGISTRY, ME, TAG, MODEL_S3_BUCKET, 비밀값(Parameter Store /<ME>/eta/, 없으면 서버에서 만든 난수)
# 로그를 CloudWatch 로 보내는 설정은 docker-compose.awslogs.yml — 로그 그룹을 만든 뒤에만 함께 쓴다

services:
  web:
    image: ${REGISTRY}/${ME}-eta-web:${TAG}
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: ${REGISTRY}/${ME}-eta-api:${TAG}
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/eta
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_VIEWER_PASSWORD: ${SEED_VIEWER_PASSWORD}
      # 모델은 이미지에 없다. 시작할 때 S3 의 current.json 이 가리키는 판을 받는다(api/model.py)
      MODEL_IMPL: sklearn
      MODEL_S3_BUCKET: ${MODEL_S3_BUCKET}
      AWS_DEFAULT_REGION: ap-northeast-2
    depends_on:
      db:
        condition: service_healthy
    # 모델을 다 받아야 healthy → `docker compose up -d --wait` 가 그때까지 기다린다
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eta
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "eta"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # HTTPS 길 1 : nginx 가 443 을 받고, 인증서는 certbot 이 Let's Encrypt 에서 받아 온다.
  # COMPOSE_PROFILES=https 일 때만 뜬다. 첫 인증서는 `lab deploy` 가 proxy 를 띄우기 전에 받는다
  proxy:
    profiles: ["https"]
    image: nginx:1.29-alpine
    # 갱신된 인증서를 읽도록 12시간마다 설정을 다시 읽는다
    command: ["/bin/sh", "-c", "while :; do sleep 12h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    ports:
      - "80:80" # 인증서 발급 확인과 http → https 넘기기
      - "443:443"
    volumes:
      - ./nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt:ro
      - acme:/var/www/certbot:ro
    depends_on:
      - web
    restart: unless-stopped

  # 12시간마다 갱신을 시도한다. 만료 30일 전부터만 실제로 갱신한다(90일짜리 인증서)
  certbot:
    profiles: ["https"]
    image: certbot/certbot:v5.1.0
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew -q --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"]
    volumes:
      - certs:/etc/letsencrypt # 받은 인증서. 지우면 다시 발급받는다(발급 횟수 제한이 있다)
      - acme:/var/www/certbot
    restart: unless-stopped

volumes:
  db_data:
  certs:
  acme:
