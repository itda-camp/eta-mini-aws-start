# HTTPS 길 1 의 앞단 nginx(docker-compose.aws.yml 의 proxy). 443 을 받아 web 으로 넘긴다.
# 인증서는 certbot 이 받아 certs 볼륨의 live/eta/ 에 둔다(--cert-name eta). 도메인은 인증서가 정한다.

server {
    listen 80;

    # Let's Encrypt 가 도메인 소유를 확인하러 오는 곳. certbot 이 이 폴더에 답을 써 둔다(갱신 때)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/letsencrypt/live/eta/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eta/privkey.pem;

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
