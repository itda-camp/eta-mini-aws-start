# 기본 : docker compose up -d --build        → web(8080) · api · db
services:
  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        MODEL_IMPL: ${MODEL_IMPL:-rule}
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/eta
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin1234}
      SEED_VIEWER_PASSWORD: ${SEED_VIEWER_PASSWORD:-viewer1234}
    # ports 가 없다 : 브라우저는 nginx(8080) 를 거쳐서만 api 에 닿는다.
    # 직접 curl 해 보고 싶으면 아래 두 줄을 풀고 CORS 를 겪어 본다.
    # ports:
    #   - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eta
    volumes:
      # PostgreSQL 18부터 공식 이미지의 디렉토리 구조가 변경
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "eta"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
